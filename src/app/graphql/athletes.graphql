query AllAthletes(
  $filter: AthleteFilter
  $sortField: String
  $sortOrder: String
) {
  allAthletes(filter: $filter, sortField: $sortField, sortOrder: $sortOrder) {
    id
    name
    sport
    status
    followers
    earnings
    avatar
    bio
    stats
  }
}

query Athlete($id: ID!) {
  Athlete(id: $id) {
    id
    name
    sport
    status
    followers
    earnings
    avatar
    bio
    stats
  }
}
